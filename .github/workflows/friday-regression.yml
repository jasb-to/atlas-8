name: FRIDAY regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - "dashboard/**"
      - ".github/workflows/friday-regression.yml"
      - ".github/workflows/friday-monitor.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - "dashboard/**"
      - ".github/workflows/friday-regression.yml"
      - ".github/workflows/friday-monitor.yml"

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib
      - name: Validate embedded FRIDAY workflow shell scripts
        run: |
          ruby -ryaml -rtempfile <<'RUBY'
          workflow = YAML.load_file(".github/workflows/friday-monitor.yml")
          steps = workflow.fetch("jobs").fetch("monitor").fetch("steps")
          checked = 0
          steps.each_with_index do |step, index|
            next unless step["run"]
            Tempfile.create(["friday-workflow-step", ".sh"]) do |file|
              file.write(step.fetch("run"))
              file.flush
              unless system("bash", "-n", file.path)
                abort "Shell syntax validation failed for friday-monitor.yml step #{index + 1}: #{step['name']}"
              end
            end
            checked += 1
          end
          abort "No embedded shell scripts were checked" if checked.zero?
          puts "Validated bash syntax for #{checked} FRIDAY workflow steps."
          RUBY
      - name: Run FRIDAY regression tests
        run: python -m unittest discover -s tests -p "test_friday_*.py" -v

  dashboard-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package.json
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
