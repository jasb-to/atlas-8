name: Trendline research validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "research/trendlines.py"
      - "research/validate_kraken_trendlines.py"
      - "research/strategy_preview.py"
      - "research/sheldon_strategy.py"
      - "tests/test_trendlines.py"
      - "tests/test_strategy_preview.py"
      - "tests/test_sheldon_strategy.py"
      - ".github/workflows/trendline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib
      - name: Run trendline geometry regression tests
        run: python -m unittest discover -s tests -p 'test_trendlines.py' -v
      - name: Run causal strategy regression tests
        run: python -m unittest discover -s tests -p 'test_strategy_preview.py' -v
      - name: Run Sheldon setup and trade replay tests
        run: python -m unittest discover -s tests -p 'test_sheldon_strategy.py' -v
      - name: Fetch Kraken BTC/USD 4H data and audit geometry
        run: python -m research.validate_kraken_trendlines --pair XBTUSD --interval 240 --output-dir results/trendline-audit
      - name: Replay 4H break strategy and build current preview
        run: python -m research.strategy_preview --pair XBTUSD --interval 240 --output-dir results/strategy-preview
      - name: Upload live data, geometry and strategy preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-8-btc-4h-strategy-preview
          path: |
            results/trendline-audit/
            results/strategy-preview/
          if-no-files-found: warn
          retention-days: 14
