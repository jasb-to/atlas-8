name: FRIDAY research checks

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/test_friday_momentum_reversal.py"
      - "tests/test_friday_paper_trades.py"
      - "tests/test_friday_persistence.py"
      - "tests/test_friday_monitor.py"
      - ".github/workflows/friday-research-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - "tests/test_friday_momentum_reversal.py"
      - "tests/test_friday_persistence.py"
      - "tests/test_friday_monitor.py"
      - ".github/workflows/friday-research-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib
      - name: Test momentum reversal scanner
        run: python -m unittest discover -s tests -p "test_friday_momentum_reversal.py"
      - name: Test paper trade stop/target lifecycle
        run: python -m unittest discover -s tests -p "test_friday_paper_trades.py"
      - name: Test repository persistence
        run: python -m unittest discover -s tests -p "test_friday_persistence.py"
      - name: Test FRIDAY monitor and pair validation
        run: python -m unittest discover -s tests -p "test_friday_monitor.py"
