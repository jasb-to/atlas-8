name: FRIDAY weekly thesis forensic audits

on:
  push:
    branches:
      - feat/friday-weekly-thesis-alert-format
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert-math:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m audits.audit_alert_math

  midweek-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m audits.audit_midweek_freeze

  daily-flipflop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m audits.audit_daily_flipflop

  filter-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m audits.backtest_filter_comparison

  main-vs-pr-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch one frozen OHLC fixture
        run: |
          mkdir -p data
          python audits/generate_regression_data.py fetch --pair AVAXUSDT --start 2026-04-01 --end 2026-10-06 --output data/raw_test.csv
      - name: Replay the same fixture on main and PR code, then compare bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git worktree add --detach /tmp/friday-main FETCH_HEAD
          python -m audits.generate_regression_data replay --input data/raw_test.csv --output "$RUNNER_TEMP/trades_candidate.jsonl"
          (
            cd /tmp/friday-main
            PYTHONPATH=/tmp/friday-main python "$GITHUB_WORKSPACE/audits/generate_regression_data.py" replay \
              --input "$GITHUB_WORKSPACE/data/raw_test.csv" \
              --output "$RUNNER_TEMP/trades_baseline.jsonl"
          )
          echo "## Main-vs-PR causal replay regression" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frozen candle fixture: data/raw_test.csv" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum data/raw_test.csv "$RUNNER_TEMP/trades_baseline.jsonl" "$RUNNER_TEMP/trades_candidate.jsonl"
          if cmp -s "$RUNNER_TEMP/trades_baseline.jsonl" "$RUNNER_TEMP/trades_candidate.jsonl"; then
            echo "- Result: PASS — baseline and candidate JSONL are byte-for-byte identical." >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: main and PR causal replay outputs are byte-for-byte identical."
          else
            echo "- Result: FAIL — baseline and candidate JSONL differ." >> "$GITHUB_STEP_SUMMARY"
            diff -u "$RUNNER_TEMP/trades_baseline.jsonl" "$RUNNER_TEMP/trades_candidate.jsonl" || true
            exit 1
          fi
      - name: Preserve forensic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-regression-fixture-and-replays
          path: |
            data/raw_test.csv
            ${{ runner.temp }}/trades_baseline.jsonl
            ${{ runner.temp }}/trades_candidate.jsonl
          if-no-files-found: warn
          retention-days: 14
