name: Friday research monitor

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/test_friday_momentum_reversal.py"
      - "tests/test_friday_monitor.py"
      - ".github/workflows/friday-monitor.yml"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      pairs:
        description: Comma-separated Kraken pairs
        required: false
        default: XBTUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,BNBUSDT,VIRTUALUSDT,HYPEUSDT,DOGEUSDT,LINKUSDT,ZECUSDT,NEARUSDT,SUIUSDT,LITUSDT
      scan_id:
        description: Correlation ID supplied by the production scan trigger
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: friday-research-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib
      - name: Run Friday monitor
        env:
          FRIDAY_STORAGE_BACKEND: repo
          FRIDAY_REPO_DATA_DIR: testing/friday/data
          FRIDAY_SCAN_RUN_ID: ${{ github.event.inputs.scan_id || format('friday-gha-{0}-{1}', github.run_id, github.run_attempt) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRIDAY_AI_REVIEW_URL: https://atlas8-friday.vercel.app/api/friday/ai-review
          FRIDAY_TRACKING_START_UTC: "2026-10-23T17:00:00+00:00"
          REQUESTED_PAIRS: ${{ github.event.inputs.pairs || 'XBTUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,BNBUSDT,VIRTUALUSDT,HYPEUSDT,DOGEUSDT,LINKUSDT,ZECUSDT,NEARUSDT,SUIUSDT,LITUSDT' }}
        run: |
          # Never interpolate workflow_dispatch input into shell source. The Python
          # validator canonicalizes legacy USD aliases to the approved USDT universe.
          PAIRS="$(python -c 'import os; from research.friday_monitor import validate_friday_pairs; print(",".join(validate_friday_pairs(os.environ["REQUESTED_PAIRS"].split(","))))')"
          echo "============================================================"
          echo "[FRIDAY] Scan started | Run ID=${GITHUB_RUN_ID} | Markets=${PAIRS}"
          echo "[FRIDAY] Analysis: completed 1D thesis + 4H execution scan"
          echo "============================================================"

          # Always print the human-readable run summary, even if the monitor exits non-zero.
          set +e
          python -u -m research.friday_monitor --pairs "$PAIRS" --output-dir results/friday-monitor
          MONITOR_EXIT=$?
          set -e

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path("results/friday-monitor")
          run_file = root / "cron_run.json"

          def show(value, default="n/a"):
              if value is None or value == "":
                  return default
              if isinstance(value, dict):
                  return value.get("state") or value.get("decision") or value.get("status") or str(value)
              return str(value)

          def reason_of(*values):
              for value in values:
                  if isinstance(value, dict):
                      reason = value.get("reason") or value.get("blocker") or value.get("why")
                      if reason:
                          return str(reason)
              return ""

          summaries = []
          if root.exists():
              for path in sorted(root.glob("*/monitor_summary.json")):
                  try:
                      summaries.append(json.loads(path.read_text()))
                  except Exception as exc:
                      print(f"[FRIDAY SCAN] {path.parent.name.upper()} | SUMMARY_READ_ERROR={exc}")

          run = {}
          if run_file.exists():
              try:
                  run = json.loads(run_file.read_text())
              except Exception as exc:
                  print(f"[FRIDAY] Could not read cron_run.json: {exc}")

          print("\n================ FRIDAY MARKET SCAN ================")
          if not summaries:
              print("[FRIDAY] No per-market summaries were written.")
          for row in summaries:
              pair = row.get("pair", "UNKNOWN")
              if row.get("status") != "ok":
                  print(f"[FRIDAY SCAN] {pair} | ERROR | {row.get('error', 'No error details recorded')}")
                  continue

              setup = row.get("latest_setup_state")
              decision = row.get("friday_decision")
              mtf_state = row.get("multitimeframe_state")
              direction = row.get("multitimeframe_direction")
              ai_status = row.get("ai_review_status", "missing")
              ai_assessment = row.get("ai_review_assessment") or "not available"
              close = row.get("last_close", "n/a")
              candle = row.get("last_completed_candle_utc", "n/a")
              events = row.get("break_event_count", 0)
              alerts = row.get("alert_results") or []

              print(f"[FRIDAY SCAN] {pair} | Close={close} | Candle={candle}")
              print(f"  Setup={show(setup)} | Decision={show(decision)}")
              print(f"  1D/4H thesis={show(mtf_state)} ({show(direction, 'no direction')})")
              print(f"  AI review={ai_status} | Assessment={ai_assessment} | Break events={events}")

              alert_summary = []
              for alert in alerts:
                  kind = alert.get("type", "candidate")
                  status = alert.get("status", "unknown")
                  why = alert.get("reason")
                  alert_summary.append(f"{kind}:{status}" + (f" ({why})" if why else ""))
              if alert_summary:
                  print("  Candidate/alert outcomes=" + "; ".join(alert_summary))
              else:
                  why = reason_of(decision, setup)
                  print("  Candidate/alert outcomes=none" + (f" | Reason={why}" if why else ""))

          pair_results = run.get("pair_results") or []
          errors = [r for r in pair_results if r.get("status") == "error"]
          ai_ok = sum(1 for r in summaries if r.get("ai_review_status") == "ok")
          ai_bad = sum(1 for r in summaries if r.get("status") == "ok" and r.get("ai_review_status") != "ok")
          candidates = sum(1 for r in summaries for a in (r.get("alert_results") or []) if a.get("type") in {"ENTRY_1", "ENTRY_2", "PAPER_ENTRY", "MOMENTUM_REVERSAL"})
          alerts_sent = sum(1 for r in summaries for a in (r.get("alert_results") or []) if a.get("sent") is True)
          alerts_blocked = sum(1 for r in summaries for a in (r.get("alert_results") or []) if a.get("sent") is False)

          duration = "n/a"
          try:
              start = datetime.fromisoformat(run["started_at"].replace("Z", "+00:00"))
              end = datetime.fromisoformat(run["finished_at"].replace("Z", "+00:00"))
              duration = f"{(end - start).total_seconds():.1f}s"
          except Exception:
              pass

          print("\n================ FRIDAY RUN SUMMARY ================")
          print(f"[FRIDAY] Status={run.get('status', 'summary_missing')} | Markets requested={len(run.get('pair_results', []))} | Summaries written={len(summaries)} | Failed={len(errors)}")
          print(f"[FRIDAY] AI reviews OK={ai_ok} | AI review missing/failed={ai_bad} | Candidate outcomes={candidates}")
          print(f"[FRIDAY] Alerts sent={alerts_sent} | Candidate/alert outcomes blocked or not sent={alerts_blocked}")
          print(f"[FRIDAY] Research events seen={run.get('trade_events_seen', 0)} | Duration={duration}")
          if run.get("error"):
              print(f"[FRIDAY] Run error={run['error']}")
          if errors:
              print("[FRIDAY] Failed markets=" + ", ".join(r.get("pair", "UNKNOWN") for r in errors))
          print("====================================================")
          PY

          exit "$MONITOR_EXIT"
      - name: Generate per-pair learning reports
        if: always()
        run: |
          if [ -d results/friday-monitor ]; then
            find results/friday-monitor -mindepth 2 -maxdepth 2 -name strategy_preview.json -print0 | while IFS= read -r -d "" preview; do
              pair_dir="$(dirname "$preview")"
              split_time="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["walk_forward_split_time"])' "$preview")"
              last_candle_time="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["last_completed_candle_utc"])' "$preview")"
              python -m research.friday_learning \
                --decisions "$pair_dir/decision_journal.jsonl" \
                --trades "$pair_dir/trade_replay.jsonl" \
                --structural-trades "$pair_dir/structural_target_replay.jsonl" \
                --entry2-trades "$pair_dir/entry2_trade_replay.jsonl" \
                --entry2-structural-trades "$pair_dir/entry2_structural_target_replay.jsonl" \
                --events "$pair_dir/break_events.jsonl" \
                --split-time "$split_time" --last-candle-time "$last_candle_time" \
                --output "$pair_dir/learning_report.json"
            done
          fi
      - name: Archive research records in the testing-only repo folder
        if: always() && github.ref == 'refs/heads/main'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%F)"
          ARCHIVE_ROOT="testing/friday/runs/$RUN_DATE/run-$RUN_ID-attempt-$RUN_ATTEMPT"
          mkdir -p "$ARCHIVE_ROOT"
          if [ -d results/friday-monitor ]; then
            while IFS= read -r -d "" source; do
              pair_dir="$(dirname "$source")"
              pair="$(basename "$pair_dir")"
              dest="$ARCHIVE_ROOT/$pair"
              mkdir -p "$dest"
              for file in strategy_preview.json decision_journal.jsonl trade_replay.jsonl structural_target_replay.jsonl entry2_trade_replay.jsonl entry2_structural_target_replay.jsonl break_events.jsonl learning_report.json multitimeframe_scan.json monitor_summary.json; do
                if [ -f "$pair_dir/$file" ]; then cp "$pair_dir/$file" "$dest/$file"; fi
              done
            done < <(find results/friday-monitor -mindepth 2 -maxdepth 2 -name strategy_preview.json -print0)
            if [ -f results/friday-monitor/cron_run.json ]; then
              cp results/friday-monitor/cron_run.json "$ARCHIVE_ROOT/cron_run.json"
            fi
          fi
          cat > "$ARCHIVE_ROOT/README.md" <<EOF
          # Friday research run $RUN_ID

          - UTC date: $RUN_DATE
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID
          - Purpose: research and paper-testing only
          - Contains hypothetical research outputs, not executed trades.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing/friday
          if git diff --cached --quiet; then
            echo "No new FRIDAY data to commit."
            exit 0
          fi
          git commit -m "test(friday): archive research run $RUN_ID"
          # Dashboard/code deployments can advance main while this scan runs.
          # Rebase the data-only archive commit before pushing to avoid losing it.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload Friday run logs and market snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-monitor-${{ github.run_id }}
          path: results/friday-monitor/
          if-no-files-found: warn
          retention-days: 30
