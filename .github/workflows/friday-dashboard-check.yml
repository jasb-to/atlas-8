name: FRIDAY dashboard checks

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/friday-dashboard-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/friday-dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dashboard dependencies
        run: npm install
      - name: Type-check dashboard
        run: npx tsc --noEmit
      - name: Build dashboard
        run: npm run build
