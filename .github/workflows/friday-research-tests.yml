name: FRIDAY research tests

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - ".github/workflows/friday-research-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - "tests/**"
      - ".github/workflows/friday-research-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
